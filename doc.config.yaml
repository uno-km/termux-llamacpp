advanced_parameters_body: "<h3>1. Device Backend & Acceleration Modes</h3>\n<table\
  \ class=\"data-table\">\n  <thead>\n    <tr><th>CLI Flag</th><th>SDK Parameter</th><th>Default</th><th>Behavior</th></tr>\n\
  \  </thead>\n  <tbody>\n    <tr>\n      <td><code>--device vulkan</code></td>\n\
  \      <td><code>device=\"vulkan\"</code></td>\n      <td>-</td>\n      <td>Strict\
  \ GPU shader acceleration mode with Fail-Fast protection (no CPU fallback).</td>\n\
  \    </tr>\n    <tr>\n      <td><code>--device auto</code></td>\n      <td><code>device=\"\
  auto\"</code></td>\n      <td><strong>Recommended</strong></td>\n      <td>Intelligent\
  \ 12-stage hardware probe with automatic CPU NEON fallback.</td>\n    </tr>\n  \
  \  <tr>\n      <td><code>--device cpu</code></td>\n      <td><code>device=\"cpu\"\
  </code></td>\n      <td>-</td>\n      <td>Bypasses Vulkan loader for 0ms direct\
  \ pure-ARM64 NEON execution.</td>\n    </tr>\n  </tbody>\n</table>\n\n<h3>2. Core\
  \ Thread Pinning & Thermal Mitigation</h3>\n<pre><code># Target 4 high-performance\
  \ big cores (Cortex-A78 / X-series)\ntermux-llama run -m models/Llama-3.2-1B.gguf\
  \ --threads 4</code></pre>"
changelog:
- version: v1.2.0
  date: '2026-09-01'
  title: Unified AMEVA Vulkan HAL & Galaxy A35 Validation
  type: Production Release (Latest)
  changes:
  - 'Unified AMEVA Vulkan HAL Integration: Deep binding with ameva-vulkan-runtime
    v1.1.0 utilizing Android Bionic Vulkan ICD (/system/lib64/libvulkan.so).'
  - 'Strict 3-Tier Execution Mode: Added --device vulkan (Fail-Fast GPU compute),
    --device auto (transparent CPU recovery), and --device cpu (0ms direct NEON forward
    pass).'
  - 'Dynamic Octa-Core Thread Tuning: Automatic detection of ARM big.LITTLE architectures
    (Exynos 1380, Snapdragon) injecting optimal big-core threads (-t 4).'
  - 'Dual Package Distribution: Synchronously released to Python PyPI (termux-llamacpp
    v1.2.0) and Node.js npm (termux-llamacpp v1.2.0).'
  - 'Real-Device Galaxy A35 Validation: End-to-end verification across CLI, Python
    SDK, Node.js npm, and background OpenAI REST server daemon.'
  - 'Supply-Chain Receipt Gatekeeper: Added verified build receipt support (llama-server.build-receipt.json)
    for local native binaries.'
- version: v1.1.1
  date: '2026-08-30'
  title: Supply-Chain Cryptographic Verification & Multi-Channel Crawler
  type: Stable Release
  changes:
  - 'Ed25519 Public Key Verification: Cryptographic manifest verification with SHA-256
    binary validation.'
  - 'Multi-Channel HuggingFace GGUF Crawler: Deep model discovery and automated quant
    downloader.'
  - 'Process Supervisor Resilience: Guaranteed zero-zombie process termination with
    tracked PID ledger.'
- version: v1.0.2
  date: '2026-08-28'
  title: Bionic Dynamic Linker Stabilization & Dual-Ecosystem Publishing
  type: Stable Release
  changes:
  - 'Bionic Shared Library Bundling: Packaged libgomp and libstdc++ to prevent missing
    symbol errors on raw Termux.'
  - 'NPM Binary Wrapper: Added standalone ESM binary resolver for Node.js environments.'
- version: v1.0.1
  date: '2026-08-27'
  title: Initial Production GGUF LLM Runtime Release
  type: Initial Release
  changes:
  - 'Prebuilt ARM64 llama.cpp Native Binaries: Direct extraction in under 3 seconds.'
  - 'Loopback Isolated OpenAI Server: /v1/chat/completions REST and SSE streaming
    supervisor.'
